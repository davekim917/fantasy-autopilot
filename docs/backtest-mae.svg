<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backtest-mae-title backtest-mae-desc" id="backtest-mae-root">
<title id="backtest-mae-title">Mean absolute error by position: our projection, the platform projection, and the 0.4/0.6 blend</title>
<desc id="backtest-mae-desc">Dot plot of MAE on 2,482 player-weeks from 2025 weeks 5 to 18. Lower is better. Overall: ours 5.73, platform 5.68, blend 5.57. The blend is lowest at every position; ours beats the platform only at QB and RB.</desc>
  <defs>
      <style>#backtest-mae-root { font-family: 'Geist', sans-serif; color: #0b0b0b; }
      #backtest-mae-root table { margin-top: 1.5rem; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
      #backtest-mae-root caption { text-align: left; color: #52514e; padding-bottom: 0.4rem; }
      #backtest-mae-root th, #backtest-mae-root td { padding: 4px 12px 4px 0; text-align: right; border-bottom: 1px solid #e6e5e1; }
      #backtest-mae-root th:first-child, #backtest-mae-root td:first-child { text-align: left; }</style>
  </defs>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="40" y="44" fill="#0b0b0b" font-size="17" font-weight="600" font-family="'Geist', sans-serif">Projection error by position, 2025 weeks 5–18</text>
<text x="40" y="64" fill="#52514e" font-size="11" font-family="'Geist', sans-serif">Mean absolute error in PPR points on 2,482 out-of-sample player-weeks. Lower is better.</text>
<circle cx="45" cy="88" r="5" fill="#2a78d6"/>
<text x="56" y="92" fill="#52514e" font-size="11" font-family="'Geist', sans-serif">ours, usage-based model (5.73 overall)</text>
