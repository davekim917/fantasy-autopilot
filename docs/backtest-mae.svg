<text x="360" y="92" fill="#52514e" font-size="11" font-family="'Geist', sans-serif">platform projection (5.67)</text>
<circle cx="569" cy="88" r="5" fill="#1baf7a"/>
<text x="580" y="92" fill="#52514e" font-size="11" font-family="'Geist', sans-serif">blend 0.4 ours / 0.6 platform (5.57)</text>
