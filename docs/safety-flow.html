<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every write passes the same gate</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Safety model</p>
    <h1>Every write passes the same gate</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="safety-flow-title safety-flow-desc">
        <title id="safety-flow-title">Every write passes the same gate</title>
        <desc id="safety-flow-desc">Flowchart of one write command: the league must be in your config, live state is re-read and league rules checked, a dry-run plan is printed, nothing is sent without --confirm, then the ownership and body guard runs before the request goes to the platform and is read back as verified true or false.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows, behind nodes -->
        <line x1="480" y1="84" x2="480" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="580" y1="150" x2="708" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="192" x2="480" y2="226" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="284" x2="480" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="370" x2="480" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="580" y1="434" x2="708" y2="434" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="476" x2="480" y2="508" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="600" y1="540" x2="708" y2="540" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="572" x2="480" y2="596" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="652" x2="480" y2="676" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="632" y="130" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="644" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="488" y="202" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="211" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="632" y="414" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="644" y="423" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="488" y="484" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="504" y="493" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="628" y="520" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="656" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">REFUSE</text>

        <!-- Start -->
        <rect x="360" y="36" width="240" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="480" y="57" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A write command</text>
        <text x="480" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">set-lineup · ir · claim · drop · cancel-claim</text>

        <!-- Decision: in config? -->
        <polygon points="480,108 580,150 480,192 380,150" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="147" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">League in</text>
        <text x="480" y="161" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">your config?</text>

        <rect x="708" y="126" width="200" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="808" y="147" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Refused</text>
        <text x="808" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nothing else is reachable</text>

        <!-- Re-read + rules -->
        <rect x="360" y="226" width="240" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="249" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Re-read live state, apply league rules</text>
        <text x="480" y="265" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">week · roster · locks · slots · IR · budget</text>

        <!-- Plan -->
        <rect x="360" y="312" width="240" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="335" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Print the plan</text>
        <text x="480" y="351" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">players · slots · bid · drop</text>

        <!-- Decision: confirm? -->
        <polygon points="480,392 580,434 480,476 380,434" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="438" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">--confirm?</text>

        <rect x="708" y="410" width="200" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="808" y="431" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dry run</text>
        <text x="808" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the default · nothing sent</text>

        <!-- Guard (focal) -->
        <rect x="360" y="508" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="480" y="530" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ownership + body guard</text>
        <text x="480" y="546" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">credential owns this team</text>
        <text x="480" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">request names only your league + team</text>

        <rect x="708" y="516" width="200" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="808" y="537" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Refused</text>
        <text x="808" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zero requests sent</text>

        <!-- Send + readback -->
        <rect x="360" y="596" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="618" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Send, then read back</text>
        <text x="480" y="634" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fresh read of the platform, retried</text>

        <!-- End -->
        <rect x="360" y="676" width="240" height="40" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="480" y="701" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">verified: true | false</text>

        <!-- Side notes, left column -->
        <text x="40" y="150" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CONFIG</text>
        <text x="40" y="166" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">alias → league id + roster/team id,</text>
        <text x="40" y="180" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">in a file only you hold</text>

        <text x="40" y="530" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CREDENTIAL</text>
        <text x="40" y="546" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">env vars, or a proxy you run;</text>
        <text x="40" y="560" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">never printed, never written</text>

        <!-- Legend -->
        <line x1="40" y1="640" x2="320" y2="640" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="672" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>
        <rect x="160" y="672" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="192" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>
        <polygon points="248,678 260,672 272,678 260,684" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="284" y="682" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>
        <line x1="40" y1="702" x2="68" y2="702" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="76" y="705" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Only path that can write</text>
      </svg>
    </div>
  </div>
</body>
</html>
